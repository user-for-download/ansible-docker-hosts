---
- name: System Preparation and Optimization
  hosts: ubuntu
  become: true
  gather_facts: true

  pre_tasks:
    - name: Validate target is Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
        fail_msg: "This playbook only supports Ubuntu hosts"
      tags: always

  roles:
    - role: host_settings
      tags: [system, base]
    - role: chrony_client
      tags: [ntp, chrony]
    # - role: security_hardening
    #   tags: [security, hardening]

  post_tasks:
    - name: Apply pending handlers
      ansible.builtin.meta: flush_handlers
      tags: [always]

    - name: Wait for NTP synchronization
      ansible.builtin.command: timedatectl show -p NTPSynchronized --value
      register: ntp_synchronized
      until: ntp_synchronized.stdout | trim == 'yes'
      retries: 24
      delay: 5
      changed_when: false
      failed_when: false
      when: not ansible_check_mode
      tags: [ntp, verify]

    - name: Verify NTP synchronization
      ansible.builtin.assert:
        that:
          - ntp_synchronized.stdout | trim == 'yes'
        fail_msg: >-
          NTP is not synchronized. Check `chronyc sources -v` and the
          configured servers ({{ ntp_servers | join(', ') }}).
      when: not ansible_check_mode
      tags: [ntp, verify]

