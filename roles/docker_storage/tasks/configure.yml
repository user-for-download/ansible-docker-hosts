---
- name: Check if old Docker directory exists
  ansible.builtin.stat:
    path: "{{ docker_data_path }}.old"
  register: docker_old_dir

- name: Stop Docker safely
  when: not docker_data_is_mount | bool
  block:
    - name: Check Docker status
      ansible.builtin.systemd:
        name: docker
      register: docker_status

    - name: Get running containers
      ansible.builtin.command: docker ps -q
      register: running_containers
      changed_when: false
      when: docker_status.status.ActiveState == "active"

    - name: Stop running containers
      ansible.builtin.command: >-
        docker stop {{ running_containers.stdout_lines | join(' ') }}
      when:
        - docker_status.status.ActiveState == "active"
        - (running_containers.stdout_lines | default([])) | length > 0
      register: containers_stopped
      failed_when: false
      changed_when: containers_stopped.rc == 0

    - name: Stop Docker service
      ansible.builtin.systemd:
        name: docker
        state: stopped
      register: docker_stopped
      until: docker_stopped.status.ActiveState == "inactive"
      retries: "{{ docker_service_retries }}"
      delay: 5

    - name: Stop Docker socket
      ansible.builtin.systemd:
        name: docker.socket
        state: stopped
      failed_when: false

- name: Migrate Docker data
  when: not docker_data_is_mount | bool
  block:
    - name: Check if Docker directory exists
      ansible.builtin.stat:
        path: "{{ docker_data_path }}"
      register: docker_dir

    - name: Move existing Docker directory
      ansible.builtin.command:
        cmd: mv {{ docker_data_path }} {{ docker_data_path }}.old
      when:
        - docker_dir.stat.exists
        - not docker_old_dir.stat.exists
      changed_when: true
      register: docker_dir_moved

- name: Record whether Docker data must be restored
  ansible.builtin.set_fact:
    docker_restore_needed: >-
      {{ docker_old_dir.stat.exists or
         (docker_dir_moved is defined and docker_dir_moved is changed) }}

- name: Configure mount point
  block:
    - name: Create Docker directory
      ansible.builtin.file:
        path: "{{ docker_data_path }}"
        state: directory
        owner: root
        group: root
        mode: "0711"

    - name: Mount Docker filesystem
      ansible.posix.mount:
        path: "{{ docker_data_path }}"
        src: "UUID={{ docker_partition_uuid }}"
        fstype: ext4
        opts: "{{ mount_options }}"
        dump: "0"
        passno: "2"
        state: mounted

- name: Restore Docker data
  when: docker_restore_needed | default(false) | bool
  block:
    - name: Copy old Docker data  # noqa: command-instead-of-module
      ansible.builtin.command: >-
        rsync -aHAX {{ docker_data_path }}.old/ {{ docker_data_path }}/
      register: data_restored
      failed_when: data_restored.rc not in [0, 23, 24]
      changed_when: data_restored.rc == 0

- name: Configure Docker daemon
  block:
    - name: Ensure Docker config directory exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy daemon.json with data-root
      ansible.builtin.template:
        src: daemon.json.j2
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        backup: true
      notify: Restart docker (storage)

- name: Start Docker
  block:
    - name: Start Docker service
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true
        daemon_reload: true
      register: docker_started
      until: docker_started.status.ActiveState == "active"
      retries: "{{ docker_service_retries }}"
      delay: 5

    - name: Wait for Docker to be ready
      ansible.builtin.command: docker info
      register: docker_ready
      until: docker_ready.rc == 0
      retries: "{{ docker_service_retries }}"
      delay: 5
      changed_when: false
