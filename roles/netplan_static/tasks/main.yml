---
- name: Validate Netplan variables
  ansible.builtin.assert:
    that:
      - static_ip is defined
      - static_interface is defined
      - static_interface in ansible_interfaces
    fail_msg: >-
      static_ip and a valid static_interface are required.
      Available interfaces: {{ ansible_interfaces | join(', ') }}

- name: Ensure Netplan is installed
  ansible.builtin.package:
    name: netplan.io
    state: present
  when: ansible_os_family == "Debian"

- name: Write Netplan static IP config
  ansible.builtin.template:
    src: netplan-static.yaml.j2
    dest: "{{ netplan_config_file }}"
    owner: root
    group: root
    mode: "0644"
  register: netplan_config

- name: Validate Netplan configuration
  ansible.builtin.command: netplan generate
  changed_when: false

- name: Check for cloud-init Netplan configuration
  ansible.builtin.stat:
    path: /etc/netplan/50-cloud-init.yaml
  register: netplan_cloud_init

- name: Disable cloud-init Netplan configuration
  ansible.builtin.command:
    cmd: mv -f /etc/netplan/50-cloud-init.yaml /etc/netplan/50-cloud-init.yaml.disabled
  when:
    - netplan_remove_cloud_init | bool
    - netplan_cloud_init.stat.exists
  changed_when: true
  register: netplan_cloud_init_disabled

- name: Remove obsolete Netplan static configuration
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/netplan/01-ansible-static.yaml
  when: item != netplan_config_file

- name: Determine whether Netplan must be applied
  ansible.builtin.set_fact:
    netplan_apply_needed: >-
      {{ not ansible_check_mode and
         (netplan_config.changed or
          (netplan_cloud_init_disabled is defined and netplan_cloud_init_disabled is changed)) }}

- name: Apply Netplan configuration
  ansible.builtin.command: netplan apply
  async: 20
  poll: 0
  changed_when: true
  when: netplan_apply_needed | bool

- name: Point connection at the static address
  ansible.builtin.set_fact:
    ansible_host: "{{ static_ip.split('/')[0] }}"
  when: netplan_apply_needed | bool

- name: Reset SSH connection after network change
  ansible.builtin.meta: reset_connection

- name: Wait for host on new IP
  ansible.builtin.wait_for_connection:
    delay: 10
    timeout: 60
  when: netplan_apply_needed | bool

- name: Read configured IPv4 addresses
  ansible.builtin.command:
    cmd: ip -j -4 addr show dev {{ static_interface }}
  register: ip_check
  changed_when: false
  when: not ansible_check_mode

- name: Parse configured IPv4 addresses
  ansible.builtin.set_fact:
    netplan_configured_ips: >-
      {{ (((ip_check.stdout | from_json) | first).addr_info | default([], true))
         | map(attribute='local') | list }}
  when: not ansible_check_mode

- name: Verify static IP is configured
  ansible.builtin.assert:
    that:
      - static_ip.split('/')[0] in netplan_configured_ips
    fail_msg: >-
      Expected {{ static_ip }} on {{ static_interface }},
      found {{ netplan_configured_ips | join(', ') }}
  when: not ansible_check_mode

- name: Disable systemd-networkd-wait-online
  ansible.builtin.systemd:
    name: systemd-networkd-wait-online.service
    enabled: false
    state: stopped
    masked: true

- name: Check cloud-init configuration directory
  ansible.builtin.stat:
    path: /etc/cloud
  register: netplan_cloud_dir

- name: Disable cloud-init if not needed
  ansible.builtin.file:
    path: /etc/cloud/cloud-init.disabled
    state: touch
    mode: "0644"
  when: netplan_cloud_dir.stat.exists

- name: Display network configuration
  ansible.builtin.debug:
    msg: "{{ ip_check.stdout_lines }}"
  when: not ansible_check_mode
